<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorite LLM</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f1117;
      color: #fff;
      height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 260px;
      background: #171a21;
      border-right: 1px solid #292d36;
      padding: 20px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .logo span {
      color: #7c5cff;
    }

    .model-label {
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #343945;
      background: #222630;
      color: white;
      outline: none;
      cursor: pointer;
    }

    .favorite {
      margin-top: 25px;
      padding: 15px;
      background: #222630;
      border-radius: 12px;
    }

    .favorite h3 {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .favorite p {
      color: #aeb4c0;
      font-size: 13px;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 65px;
      border-bottom: 1px solid #292d36;
      display: flex;
      align-items: center;
      padding: 0 25px;
      font-size: 16px;
    }

    #currentModel {
      color: #9b82ff;
      margin-left: 6px;
      font-weight: bold;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
    }

    .message {
      max-width: 800px;
      margin: 0 auto 20px;
      padding: 15px 18px;
      border-radius: 14px;
      line-height: 1.5;
    }

    .user {
      background: #292d3a;
    }

    .assistant {
      background: #191c24;
      border: 1px solid #292d36;
    }

    .input-area {
      padding: 20px;
      border-top: 1px solid #292d36;
    }

    .input-box {
      max-width: 800px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 50px;
      max-height: 150px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #343945;
      background: #20232c;
      color: white;
      outline: none;
      font-family: inherit;
    }

    button {
      width: 55px;
      border: none;
      border-radius: 12px;
      background: #7c5cff;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    button:hover {
      background: #6848e8;
    }

    .empty {
      text-align: center;
      color: #777f8f;
      margin-top: 20vh;
    }

    @media (max-width: 700px) {
      .sidebar {
        display: none;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">
    <div class="logo">
      ⭐ <span>Favorite</span> LLM
    </div>

    <div class="model-label">Choose your model</div>

    <select id="modelSelect" onchange="changeModel()">
      <option value="GPT-5.6 Luna">GPT-5.6 Luna</option>
      <option value="Claude">Claude</option>
      <option value="Gemini">Gemini</option>
      <option value="Llama">Llama</option>
      <option value="Mistral">Mistral</option>
    </select>

    <div class="favorite">
      <h3>⭐ Favorite Model</h3>
      <p id="favoriteName">GPT-5.6 Luna</p>
    </div>
  </aside>

  <main class="main">

    <header>
      Chatting with <span id="currentModel">GPT-5.6 Luna</span>
    </header>

    <section class="chat" id="chat">
      <div class="empty" id="empty">
        <h2>What would you like to ask?</h2>
        <p>Choose an LLM and start chatting.</p>
      </div>
    </section>

    <div class="input-area">
      <div class="input-box">
        <textarea
          id="messageInput"
          placeholder="Message your favorite LLM..."
          onkeydown="handleKey(event)"
        ></textarea>

        <button onclick="sendMessage()">➤</button>
      </div>
    </div>

  </main>

  <script>
    const modelSelect = document.getElementById("modelSelect");
    const currentModel = document.getElementById("currentModel");
    const favoriteName = document.getElementById("favoriteName");
    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const empty = document.getElementById("empty");

    function changeModel() {
      const model = modelSelect.value;

      currentModel.textContent = model;
      favoriteName.textContent = model;

      localStorage.setItem("favoriteLLM", model);
    }

    function sendMessage() {
      const message = input.value.trim();

      if (!message) return;

      empty.style.display = "none";

      addMessage(message, "user");

      input.value = "";

      // Demo response
      setTimeout(() => {
        addMessage(
          `This is a demo response from ${modelSelect.value}. Connect this page to an LLM API to receive real responses.`,
          "assistant"
        );
      }, 500);
    }

    function addMessage(text, type) {
      const message = document.createElement("div");

      message.className = `message ${type}`;
      message.textContent = text;

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    function handleKey(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    // Load saved favorite model
    const savedModel = localStorage.getItem("favoriteLLM");

    if (savedModel) {
      modelSelect.value = savedModel;
      currentModel.textContent = savedModel;
      favoriteName.textContent = savedModel;
    }
  </script>

</body>
</html>
